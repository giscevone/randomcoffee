<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'">
  <title>Рандом кофе — идеи для хорошей встречи</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --ink: #24231f;
      --muted: #74716a;
      --line: #e8e4da;
      --yellow: #ffd84a;
      --yellow-hover: #ffcf24;
      --yellow-soft: #fff4bd;
      --shadow: 0 22px 60px rgba(45, 39, 24, .10), 0 3px 12px rgba(45, 39, 24, .05);
      --shadow-soft: 0 10px 30px rgba(45, 39, 24, .07);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--bg); color-scheme: light; }

    ::selection { background: rgba(255, 216, 74, .55); color: var(--ink); }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 4%, rgba(255, 216, 74, .16), transparent 28rem),
        radial-gradient(circle at 90% 35%, rgba(255, 238, 166, .20), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 26px 0 48px;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
    }

    .brand { display: inline-flex; align-items: center; gap: 12px; }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(211, 174, 25, .25);
      border-radius: 15px;
      background: var(--yellow);
      box-shadow: 0 7px 18px rgba(205, 162, 0, .18);
      font-size: 24px;
    }

    .brand-copy strong { display: block; font-size: 18px; letter-spacing: -.025em; }
    .brand-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    .menu-wrap { position: relative; z-index: 20; }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 3px 12px rgba(45,39,24,.04);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .icon-button:hover { transform: translateY(-1px); background: #fff; box-shadow: var(--shadow-soft); }
    .icon-button:focus-visible, .primary:focus-visible, .secondary:focus-visible, .menu-item:focus-visible, .copy-link:focus-visible { outline: 3px solid rgba(231, 183, 0, .28); outline-offset: 3px; }
    .dots { font-size: 24px; line-height: 0; transform: translateY(-3px); letter-spacing: 1px; }

    .menu {
      position: absolute;
      top: 53px;
      right: 0;
      width: 292px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.97);
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.98);
      transform-origin: top right;
      transition: .18s ease;
      backdrop-filter: blur(14px);
    }

    .menu.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 13px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      text-align: left;
      font-weight: 650;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s ease;
    }

    .menu-item:hover { background: #f7f5ef; }
    .menu-icon { width: 20px; text-align: center; color: #7b766a; font-size: 17px; }
    .privacy { margin: 7px 5px 4px; padding: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.45; }
    .privacy-dot { color: #2da867; }

    .hero { padding: 48px 0 28px; text-align: center; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 8px 13px;
      border: 1px solid rgba(205, 162, 0, .18);
      border-radius: 999px;
      background: rgba(255, 244, 189, .65);
      color: #6a5814;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(38px, 5.5vw, 72px); line-height: .98; letter-spacing: -.065em; }
    .subtitle { margin: 18px auto 0; color: var(--muted); font-size: clamp(16px, 2vw, 20px); line-height: 1.55; }
    .subtitle span { display: block; margin-top: 3px; font-size: .84em; color: #918d84; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      align-items: center;
      gap: clamp(34px, 6vw, 78px);
      margin: 12px auto 0;
      max-width: 1030px;
    }

    .wheel-column { display: flex; flex-direction: column; align-items: center; min-width: 0; }

    .wheel-stage {
      position: relative;
      width: min(62vw, 560px);
      min-height: 520px;
      padding: 22px;
      isolation: isolate;
    }

    .wheel-halo { position: absolute; inset: 10% 2%; border-radius: 80px; background: rgba(255, 216, 74, .23); filter: blur(38px); z-index: -1; }

    .slot-machine {
      position: relative;
      width: 100%;
      padding: 18px 20px 22px;
      border: 2px solid #1f1e1a;
      border-radius: 34px;
      background: linear-gradient(145deg, #34332d 0%, #1f1e1a 58%, #292823 100%);
      box-shadow: 0 28px 65px rgba(45,39,24,.20), inset 0 0 0 4px rgba(255,255,255,.06), inset 0 0 0 7px #d9ad20;
    }

    .machine-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 54px;
      color: #fff3b7;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .16em;
    }

    .machine-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 13px rgba(255,216,74,.8);
    }

    .reel-frame {
      position: relative;
      padding: 13px;
      border: 1px solid #d7aa20;
      border-radius: 23px;
      background: linear-gradient(180deg, #bd8d10, #ffe579 8%, #9a6d07 100%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.75), 0 8px 24px rgba(0,0,0,.24);
    }

    .reel-screen {
      --row-height: 66px;
      position: relative;
      height: 330px;
      overflow: hidden;
      border: 2px solid #171612;
      border-radius: 14px;
      background: #fffdf5;
      box-shadow: inset 0 12px 28px rgba(41,40,34,.14), inset 0 -12px 28px rgba(41,40,34,.14);
    }

    .reel-screen::before,
    .reel-screen::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      z-index: 4;
      height: 106px;
      pointer-events: none;
    }

    .reel-screen::before { top: 0; background: linear-gradient(#fffdf5 8%, rgba(255,253,245,.82) 50%, transparent); }
    .reel-screen::after { bottom: 0; background: linear-gradient(transparent, rgba(255,253,245,.82) 50%, #fffdf5 92%); }

    .selection-window {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      z-index: 5;
      height: var(--row-height);
      transform: translateY(-50%);
      border: 2px solid #d9ad20;
      border-radius: 12px;
      background: rgba(255,216,74,.16);
      box-shadow: 0 0 0 4px rgba(255,216,74,.08), inset 0 0 20px rgba(255,216,74,.12);
      pointer-events: none;
    }

    .selection-window::before,
    .selection-window::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .selection-window::before { left: -10px; border-left: 0; border-right: 9px solid #d9ad20; }
    .selection-window::after { right: -10px; border-right: 0; border-left: 9px solid #d9ad20; }

    .reel-track {
      position: relative;
      z-index: 2;
      padding: 132px 14px;
      will-change: transform;
      transform: translateY(0);
    }

    .reel-item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--row-height);
      padding: 0 18px;
      border-bottom: 1px solid #ebe5d6;
      color: #777269;
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 750;
      line-height: 1.12;
      text-align: center;
    }

    .reel-item.final { color: #24231f; font-size: clamp(20px, 2.35vw, 27px); font-weight: 850; }

    .reel-item > span:last-child {
      display: -webkit-box;
      max-width: calc(100% - 34px);
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
    }

    .machine-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      height: 50px;
      color: #d7d1c2;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .machine-bottom span { color: var(--yellow); }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 230px;
      min-height: 56px;
      padding: 15px 24px;
      border: 1px solid rgba(190, 148, 0, .18);
      border-radius: 17px;
      background: var(--yellow);
      box-shadow: 0 11px 26px rgba(211, 168, 0, .22);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .025em;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .primary:hover { transform: translateY(-2px); background: var(--yellow-hover); box-shadow: 0 14px 31px rgba(211,168,0,.27); }
    .primary:active { transform: translateY(0) scale(.985); }
    .primary:disabled { cursor: wait; opacity: .64; transform: none; }

    .side { display: flex; flex-direction: column; gap: 16px; }

    .result-card, .tip-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.88);
      box-shadow: var(--shadow-soft);
      text-align: left;
      backdrop-filter: blur(10px);
    }

    .result-card {
      min-height: 250px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: opacity .28s ease, transform .28s ease;
    }

    .result-card.enter { animation: cardIn .48s cubic-bezier(.2,.8,.2,1); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

    .result-kicker { display: flex; align-items: center; gap: 8px; color: #8b7418; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .result-title { margin: 14px 0 9px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .question { margin: 0; font-size: clamp(20px, 2.4vw, 27px); line-height: 1.25; letter-spacing: -.035em; font-weight: 750; }
    .empty-copy { color: var(--muted); font-size: 16px; line-height: 1.55; }

    .result-actions { display: none; gap: 9px; margin-top: 23px; flex-wrap: wrap; }
    .result-card.has-result .result-actions { display: flex; }

    .secondary {
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: .18s ease;
    }

    .secondary:hover { background: var(--surface-soft); transform: translateY(-1px); }

    .tip-card { padding: 18px 20px; }
    .tip-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 800; }
    .tip-text { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

    .footer { margin-top: 46px; text-align: center; color: #a09c93; font-size: 11px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 50;
      width: min(410px, calc(100% - 32px));
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #292822;
      box-shadow: var(--shadow);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 13px);
      transition: .25s ease;
    }

    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    .toast.error { background: #5c2d2b; }
    #fileInput { display: none; }

    @media (max-width: 860px) {
      .app { width: min(100% - 28px, 680px); }
      .hero { padding-top: 36px; }
      .workspace { grid-template-columns: 1fr; gap: 28px; }
      .wheel-stage { width: min(88vw, 560px); min-height: 500px; }
      .side { width: min(100%, 560px); margin: 0 auto; }
      .result-card { min-height: auto; }
    }

    @media (max-width: 520px) {
      .app { width: min(100% - 20px, 470px); padding-top: 16px; }
      .brand-copy span { display: none; }
      .hero { padding: 31px 0 22px; }
      .eyebrow { margin-bottom: 12px; }
      .subtitle { margin-top: 13px; }
      .wheel-stage { width: min(96vw, 470px); min-height: 450px; padding: 10px; }
      .slot-machine { padding: 13px 14px 16px; border-radius: 27px; }
      .machine-top { height: 48px; font-size: 11px; }
      .reel-frame { padding: 9px; }
      .reel-screen { --row-height: 60px; height: 300px; }
      .reel-track { padding-top: 120px; padding-bottom: 120px; }
      .reel-item { padding-inline: 12px; font-size: 16px; }
      .primary { min-width: 210px; min-height: 52px; }
      .menu { width: min(292px, calc(100vw - 20px)); }
      .result-card { padding: 22px; }
    }

    /* Clean finance-app visual language: neutral surfaces and one yellow accent. */
    body {
      background: #f5f5f5;
    }

    .app {
      width: min(1160px, calc(100% - 40px));
      padding-top: 18px;
    }

    .topbar {
      min-height: 44px;
      justify-content: flex-end;
    }

    .hero {
      padding: 28px 0 38px;
    }

    .hero h1 {
      font-size: clamp(42px, 5vw, 66px);
      letter-spacing: -.06em;
    }

    .subtitle {
      margin-top: 13px;
      color: #777;
      font-size: 18px;
    }

    .workspace {
      grid-template-columns: minmax(0, 1.12fr) minmax(330px, .88fr);
      align-items: stretch;
      gap: 22px;
      max-width: 1040px;
      padding: 24px;
      border: 1px solid #ececec;
      border-radius: 32px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(0,0,0,.055);
    }

    .wheel-column {
      justify-content: center;
      padding: 8px;
    }

    .wheel-stage {
      width: 100%;
      min-height: auto;
      padding: 0;
    }

    .wheel-halo { display: none; }

    .slot-machine {
      padding: 10px;
      border: 0;
      border-radius: 25px;
      background: #f1f2f3;
      box-shadow: none;
    }

    .reel-frame {
      padding: 0;
      border: 0;
      border-radius: 19px;
      background: transparent;
      box-shadow: none;
    }

    .reel-screen {
      height: 330px;
      border: 0;
      border-radius: 19px;
      background: #fafafa;
      box-shadow: inset 0 0 0 1px #e7e7e7;
    }

    .reel-screen::before { background: linear-gradient(#fafafa 10%, rgba(250,250,250,.90) 48%, transparent); }
    .reel-screen::after { background: linear-gradient(transparent, rgba(250,250,250,.90) 52%, #fafafa 90%); }

    .selection-window {
      left: 10px;
      right: 10px;
      border: 0;
      border-radius: 14px;
      background: #ffdd2d;
      box-shadow: none;

    }

    .selection-window::before,
    .selection-window::after { display: none; }

    .reel-item {

    }

    }

      background: #fccf24;

    }

    }

    @media (max-width: 860px) {

      .wheel-stage { width: 100%; min-height: auto; }

    }

    @media (max-width: 520px) {
      .app { width: min(100% - 16px, 470px); }
      .hero { padding: 18px 0 28px; }
      .subtitle { font-size: 16px; }

      .wheel-column { padding: 0; }

      .reel-screen { height: 300px; }

    }

    /* Refined warm visual language inspired by the original concept. */
    body {
      background:
        radial-gradient(circle at 50% -12%, rgba(255, 221, 45, .17), transparent 36rem),
        radial-gradient(circle at 8% 55%, rgba(255, 238, 165, .12), transparent 28rem),
        #f8f6f0;
    }

    .icon-button {
      border-color: #e7e1d6;
      background: rgba(255,255,255,.88);
      box-shadow: 0 5px 16px rgba(48,42,28,.055);
    }

    .hero {
      padding-top: 22px;
      padding-bottom: 42px;
    }

    .hero h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .18em;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }

    .title-emoji {
      display: inline-block;
      flex: 0 0 auto;
      font-size: .78em;
      line-height: 1;
      transform: translateY(.02em);
    }

    .subtitle > span {
      margin-top: 5px;
      color: #99958c;
      font-size: .88em;
    }

    .workspace {
      gap: 28px;
      padding: 30px;
      border-color: rgba(224,217,203,.82);
      border-radius: 34px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.94), rgba(255,253,247,.82));
      box-shadow:
        0 24px 65px rgba(54,46,27,.08),
        0 3px 12px rgba(54,46,27,.035),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
    }

    .slot-machine {
      padding: 12px;
      border: 1px solid #e4ded1;
      border-radius: 27px;
      background: linear-gradient(150deg, #fffdf8, #f0ede5);
      box-shadow:
        0 16px 35px rgba(57,48,26,.09),
        inset 0 1px 0 #fff;
    }

    .reel-frame {
      padding: 7px;
      border-radius: 21px;
      background: #e9e5dc;
      box-shadow: inset 0 1px 3px rgba(55,49,35,.09);
    }

    .reel-screen {
      border-radius: 16px;
      background: #fff;
      box-shadow:
        inset 0 0 0 1px #ded9ce,
        inset 0 14px 30px rgba(49,43,30,.055),
        inset 0 -14px 30px rgba(49,43,30,.055);
    }

    .reel-screen::before { background: linear-gradient(#fff 9%, rgba(255,255,255,.9) 48%, transparent); }
    .reel-screen::after { background: linear-gradient(transparent, rgba(255,255,255,.9) 52%, #fff 91%); }

    .selection-window {
      left: 8px;
      right: 8px;
      border: 1px solid rgba(190,146,0,.18);
      background: linear-gradient(180deg, #ffe875, #ffdc3f);
      box-shadow:
        0 8px 20px rgba(213,168,0,.19),
        inset 0 1px 0 rgba(255,255,255,.55);
    }

    .reel-item {
      color: #8c887f;
      border-bottom-color: #efebe3;
    }

    .reel-item.final {
      color: #24231f;
      letter-spacing: -.02em;
    }

    .reel-type-icon {
      flex: 0 0 auto;
      margin-right: 10px;
      font-size: .78em;

    /* Mobile hardening for iPhone, Android and narrow GitHub Pages views. */
    @media (max-width: 600px) {
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }

      body { min-height: 100svh; }

      .app {
        display: block;
        width: 100%;
        min-height: 100svh;
        padding:
          max(48px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }

        max-height: calc(100svh - env(safe-area-inset-top) - 68px);

        -webkit-overflow-scrolling: touch;

        margin: 0;
        border-radius: 22px;

        padding: 28px 14px 24px;
      }

        display: block;
        width: 100%;
        white-space: normal;

        line-height: 1.04;
        letter-spacing: -.05em;
        text-align: center;
        text-wrap: balance;
      }

      }

    /* Windows / Edge performance hardening */
    .windows .reel-track {
      will-change: transform;
      contain: layout paint style;

    .windows .reel-screen {

    .windows .reel-is-spinning .reel-item {

    }

    .windows .reel-is-spinning .reel-screen::before,
    .windows .reel-is-spinning .reel-screen::after {
      opacity: .84;
    }

  </style>

  <input id="fileInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">

  <script id="embeddedData" type="application/json">{"version":2,"customized":false,"topics":[]}</script>
  <script>
    'use strict';

    const IS_WINDOWS = /Windows/i.test(navigator.userAgent);
    const REEL_EASING = 'cubic-bezier(.17,0,.18,1)';
    const MAX_IDEAS = 500;
    const MAX_FILE_SIZE = 8 * 1024 * 1024;
    const MAX_UNZIPPED_SIZE = 32 * 1024 * 1024;
    const MAX_ZIP_ENTRIES = 512;
    const MAX_XML_SIZE = 6 * 1024 * 1024;
    document.documentElement.classList.toggle('windows', IS_WINDOWS);

    const DEFAULT_TOPICS = [
      { type: 'Тема', topic: 'Путешествия', question: 'Какое путешествие запомнилось тебе больше всего?', tip: 'Спросите, какое место из этой поездки собеседник посоветовал бы увидеть именно вам.' },
      { type: 'Тема', topic: 'Хобби', question: 'Чем тебе нравится заниматься после работы?', tip: 'Попробуйте найти хобби, которое было бы интересно попробовать вместе.' },
      { type: 'Тема', topic: 'Кино и сериалы', question: 'Какой фильм или сериал ты готов пересматривать?', tip: 'Попросите выбрать одну сцену или героя и объяснить, чем именно они запомнились.' },
      { type: 'Тема', topic: 'Музыка', question: 'Какая песня мгновенно поднимает тебе настроение?', tip: 'Можно сразу включить по одному любимому треку и обменяться музыкальными открытиями.' },
      { type: 'Тема', topic: 'Карьера', question: 'Какой профессиональный навык ты хотел бы освоить?', tip: 'Поделитесь одним небольшим шагом, с которого можно начать осваивать этот навык.' },
      { type: 'Тема', topic: 'Мечты', question: 'Какой небольшой мечте ты хотел бы дать шанс в этом году?', tip: 'Спросите, что можно сделать для этой мечты уже на ближайшей неделе.' },
      { type: 'Тема', topic: 'Технологии', question: 'Какая технология заметно упростила твою жизнь?', tip: 'Обменяйтесь по одному приложению или приёму, который экономит вам время.' },
      { type: 'Тема', topic: 'Книги', question: 'Какую книгу ты недавно советовал другим?', tip: 'Попросите описать книгу тремя словами — без спойлеров.' },
      { type: 'Тема', topic: 'Необычный факт', question: 'Какой неожиданный факт о тебе обычно удивляет людей?', tip: 'После ответа попробуйте угадать ещё один неожиданный факт друг о друге.' },
      { type: 'Тема', topic: 'Идеальный выходной', question: 'Как выглядит твой идеальный свободный день?', tip: 'Сравните ваши варианты и найдите хотя бы одну общую деталь.' },
      { type: 'Тема', topic: 'Город', question: 'Какое место в твоём городе ты показал бы гостю первым?', tip: 'Соберите из ваших ответов короткий маршрут на один свободный вечер.' },
      { type: 'Тема', topic: 'Вдохновение', question: 'Что в последнее время тебя по-настоящему вдохновило?', tip: 'Уточните, изменилось ли после этого какое-нибудь решение или привычка.' },
      { type: 'Активность', topic: 'Прогуляться', question: 'Предлагаем выйти на короткую прогулку и продолжить разговор на свежем воздухе.', tip: 'Выберите новый маршрут и первые пять минут не обсуждайте рабочие задачи.' },
      { type: 'Активность', topic: 'Вместе пообедать', question: 'Выберите место поблизости и устройте совместный обед.', tip: 'Пусть один выбирает место, а второй — блюдо или напиток, который стоит попробовать.' },
      { type: 'Активность', topic: 'Настольный теннис', question: 'Сыграйте короткую дружескую партию в настольный теннис.', tip: 'Придумайте максимально несерьёзный приз победителю.' },
      { type: 'Активность', topic: 'Разгадать загадку', question: 'Найдите небольшую загадку или головоломку и попробуйте решить её вместе.', tip: 'Сначала обсудите версии вслух: ход мыслей часто интереснее правильного ответа.' },
      { type: 'Активность', topic: 'Кофейная пауза', question: 'Возьмите по любимому напитку и устройте пятнадцатиминутную паузу без разговоров о задачах.', tip: 'Закажите друг другу напиток или расскажите, почему обычно выбираете именно свой.' },
      { type: 'Активность', topic: 'Мини-викторина', question: 'Выберите короткую викторину и вместе ответьте на несколько вопросов.', tip: 'Играйте одной командой и придумайте ей смешное название.' }
    ];

    const STORAGE_KEY = 'randomCoffeeTopicsV2';
    const THEME_STORAGE_KEY = 'randomCoffeeThemeV1';
    const VALID_THEMES = ['autumn', 'winter', 'spring', 'summer', 'newyear', 'valentine'];
    const THEME_LABELS = {
      autumn: 'Осень',
      winter: 'Зима',
      spring: 'Весна',
      summer: 'Лето',
      newyear: 'Новый год',
      valentine: 'День влюблённых'
    };
    const THEME_COLORS = {
      autumn: '#f7eee3',
      winter: '#edf4f8',
      spring: '#f1f7ed',
      summer: '#eef8f7',
      newyear: '#f1f5f1',
      valentine: '#fff1f4'
    };
    const reelScreen = document.getElementById('reelScreen');
    const reelTrack = document.getElementById('reelTrack');
    const spinButton = document.getElementById('spinButton');
    const resultCard = document.getElementById('resultCard');
    const emptyCopy = document.getElementById('emptyCopy');
    const resultContent = document.getElementById('resultContent');
    const resultKicker = document.getElementById('resultKicker');
    const resultIcon = document.getElementById('resultIcon');
    const resultQuestion = document.getElementById('resultQuestion');
    const copyLinkButton = document.getElementById('copyLinkButton');
    const copyLinkLabel = document.getElementById('copyLinkLabel');
    const menuButton = document.getElementById('menuButton');
    const menu = document.getElementById('menu');
    const fileInput = document.getElementById('fileInput');
    const toast = document.getElementById('toast');
    const meetingTip = document.getElementById('meetingTip');
    const meetingTipText = document.getElementById('meetingTipText');
    const themeButtons = [...document.querySelectorAll('[data-theme-choice]')];
    let topics = loadTopics();
    let currentTheme = 'autumn';
    let spinning = false;
    let lastIndex = -1;
    let toastTimer;
    let activeReelAnimation = null;
    let reelFinishTimer = null;
    let reelStartFrame = null;
    let windowsAnimationFrame = null;
    let typeBag = [];
    let currentLink = '';
    let copyLabelTimer = null;

    function readEmbeddedTopics() {
      try {
        const node = document.getElementById('embeddedData');
        const data = JSON.parse(node ? node.textContent : '{}');
        if (data && data.version === 2 && Array.isArray(data.topics) && data.topics.length >= 2) {
          const restored = data.topics.map(item => ({ ...item }));
          validateTopics(restored);
          return {
            customized: data.customized === true,
            topics: restored,
            theme: VALID_THEMES.includes(data.theme) ? data.theme : ''
          };
        }
      } catch (_) {}
      return null;
    }

    function loadTopics() {
      const embedded = readEmbeddedTopics();
      if (embedded && embedded.customized) return embedded.topics;
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length >= 2) {
          const restored = saved.map(item => ({ ...item, type: item.type === 'Активность' ? 'Активность' : 'Тема' }));
          validateTopics(restored);
          return restored;
        }
      } catch (_) {}
      return embedded ? embedded.topics : DEFAULT_TOPICS.map(item => ({ ...item }));
    }

    function seasonalDefault() {
      const month = new Date().getMonth();
      if (month === 11 || month <= 1) return 'winter';
      if (month <= 4) return 'spring';
      if (month <= 7) return 'summer';
      return 'autumn';
    }

    function initialTheme() {
      try {
        const saved = localStorage.getItem(THEME_STORAGE_KEY);
        if (VALID_THEMES.includes(saved)) return saved;
      } catch (_) {}
      const embedded = readEmbeddedTopics();
      if (embedded && embedded.customized && embedded.theme) return embedded.theme;
      return seasonalDefault();
    }

    function applyTheme(theme, persist = true) {
      currentTheme = VALID_THEMES.includes(theme) ? theme : seasonalDefault();
      document.body.dataset.theme = currentTheme === 'newyear' ? 'winter' : currentTheme === 'valentine' ? 'spring' : currentTheme;
      if (currentTheme === 'newyear') document.body.dataset.festive = 'true';
      else delete document.body.dataset.festive;
      if (currentTheme === 'valentine') document.body.dataset.romantic = 'true';
      else delete document.body.dataset.romantic;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', THEME_COLORS[currentTheme]);
      themeButtons.forEach(button => {
        const active = button.dataset.themeChoice === currentTheme;
        button.classList.toggle('active', active);
        button.setAttribute('aria-checked', String(active));
      });
      if (persist) {
        try { localStorage.setItem(THEME_STORAGE_KEY, currentTheme); } catch (_) {}
      }
    }

    function showTip(value) {
      const text = String(value || '').trim();
      if (!text) {
        meetingTipText.textContent = '';
        meetingTip.hidden = true;
        return;
      }
      meetingTip.hidden = false;
      meetingTipText.classList.add('changing');
      window.setTimeout(() => {
        meetingTipText.textContent = text;
        meetingTipText.classList.remove('changing');
      }, 120);
    }

    function randomInt(max) {
      if (max <= 1) return 0;
      if (window.crypto && crypto.getRandomValues) {
        const limit = Math.floor(0x100000000 / max) * max;
        const values = new Uint32Array(1);
        do crypto.getRandomValues(values); while (values[0] >= limit);
        return values[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function shuffled(values) {
      const result = values.slice();
      for (let i = result.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function nextIndex() {
      if (topics.length === 1) return 0;
      const themes = [];
      const activities = [];
      topics.forEach((item, index) => (item.type === 'Активность' ? activities : themes).push(index));

      let pool = topics.map((_, index) => index);
      if (themes.length && activities.length) {
        // В каждой серии из четырёх запусков — поровну тем и активностей,
        // но порядок остаётся случайным.
        if (!typeBag.length) typeBag = shuffled(['Тема', 'Тема', 'Активность', 'Активность']);
        pool = typeBag.shift() === 'Активность' ? activities : themes;
      } else {
        typeBag = [];
      }

      const withoutLast = pool.filter(index => index !== lastIndex);
      const available = withoutLast.length ? withoutLast : pool;
      return available[randomInt(available.length)];
    }

    function rowHeight() {
      return parseFloat(getComputedStyle(reelScreen).getPropertyValue('--row-height')) || 66;
    }

    function reelItem(index, isFinal = false) {
      const item = document.createElement('div');
      const activity = topics[index].type === 'Активность';
      item.className = 'reel-item' + (activity ? ' activity' : '') + (isFinal ? ' final' : '');
      const label = document.createElement('span');
      label.textContent = topics[index].topic;
      item.append(label);
      return item;
    }

    function renderRestingReel(centerIndex = 0) {
      reelTrack.replaceChildren();
      for (let offset = -2; offset <= 2; offset++) {
        const index = (centerIndex + offset + topics.length) % topics.length;
        reelTrack.appendChild(reelItem(index, offset === 0));
      }
      reelTrack.style.transition = 'none';
      reelTrack.style.transform = `translate3d(0, ${-2 * rowHeight()}px, 0)`;
    }

    function runReel(selected, duration, steps, done) {
      const sequence = [];
      sequence.push(lastIndex >= 0 ? lastIndex : randomInt(topics.length));
      for (let i = 1; i < steps; i++) sequence.push(randomInt(topics.length));
      sequence.push(selected);

      reelTrack.replaceChildren();
      sequence.forEach((index, position) => reelTrack.appendChild(reelItem(index, position === sequence.length - 1)));
      reelTrack.style.transition = 'none';
      reelTrack.style.transform = 'translate3d(0, 0, 0)';
      reelTrack.classList.add('is-spinning');
      document.body.classList.add('reel-is-spinning');

      const target = -(sequence.length - 1) * rowHeight();
      let finished = false;

      const finish = () => {
        if (finished) return;
        finished = true;
        clearTimeout(reelFinishTimer);
        if (reelStartFrame !== null) cancelAnimationFrame(reelStartFrame);
        reelStartFrame = null;
        if (windowsAnimationFrame !== null) cancelAnimationFrame(windowsAnimationFrame);
        windowsAnimationFrame = null;
        if (activeReelAnimation) activeReelAnimation.cancel();
        activeReelAnimation = null;
        reelTrack.classList.remove('is-spinning');
        document.body.classList.remove('reel-is-spinning');
        renderRestingReel(selected);
        done();
      };

      const startWindowsMotion = () => {
        const start = performance.now();
        const easeOutQuint = t => 1 - Math.pow(1 - t, 5);

        const frame = now => {
          if (finished) return;
          const progress = Math.min(1, (now - start) / duration);
          const y = target * easeOutQuint(progress);
          reelTrack.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0)`;
          if (progress < 1) {
            windowsAnimationFrame = requestAnimationFrame(frame);
          } else {
            windowsAnimationFrame = null;
            finish();
          }
        };
        windowsAnimationFrame = requestAnimationFrame(frame);
      };

      const startMotion = () => {
        reelStartFrame = null;
        if (finished) return;
        void reelTrack.offsetHeight;

        if (IS_WINDOWS) {
          startWindowsMotion();
        } else if (typeof reelTrack.animate === 'function') {
          activeReelAnimation = reelTrack.animate(
            [
              { transform: 'translate3d(0, 0, 0)' },
              { transform: `translate3d(0, ${target}px, 0)` }
            ],
            { duration, easing: REEL_EASING, fill: 'forwards' }
          );
          activeReelAnimation.onfinish = finish;
        } else {
          reelTrack.style.transition = `transform ${duration}ms ${REEL_EASING}`;
          window.setTimeout(() => {
            reelTrack.style.transform = `translate3d(0, ${target}px, 0)`;
          }, 20);
        }
        reelFinishTimer = window.setTimeout(finish, duration + 250);
      };

      // Один подготовительный кадр гарантирует, что Edge/Chrome сначала
      // отрисует ленту, а уже затем начнёт трансформацию.
      reelStartFrame = requestAnimationFrame(startMotion);
    }

    function spin() {
      if (spinning || topics.length < 2) return;
      spinning = true;
      setControls(true);
      const selected = nextIndex();
      // На Windows используется собственный плавный режим. Некоторые системные
      // настройки ошибочно сообщают браузеру reduced-motion и обрывают прокрутку.
      const reducedMotion = !IS_WINDOWS && matchMedia('(prefers-reduced-motion: reduce)').matches;
      const duration = IS_WINDOWS ? 4300 + randomInt(300) : reducedMotion ? 80 : 3700 + randomInt(350);
      const steps = IS_WINDOWS ? 18 + randomInt(3) : reducedMotion ? 1 : 25 + randomInt(4);
      runReel(selected, duration, steps, () => {
        spinning = false;
        lastIndex = selected;
        setControls(false);
        showResult(selected);
      });
    }

    function setControls(disabled) {
      spinButton.disabled = disabled;
      spinButton.lastElementChild.textContent = disabled ? 'Крутим рулетку…' : 'Крутить рулетку 🎲';
    }

    function showResult(index) {
      const item = topics[index];
      resultKicker.textContent = item.type === 'Активность' ? 'Активность' : 'Тема для встречи';
      resultIcon.textContent = item.type === 'Активность' ? '⚡️' : '💬';
      resultQuestion.textContent = item.question;
      showTip(item.tip);
      currentLink = String(item.link || '').trim();
      clearTimeout(copyLabelTimer);
      copyLinkLabel.textContent = 'Скопировать ссылку';
      copyLinkButton.hidden = !currentLink;
      emptyCopy.hidden = true;
      resultContent.hidden = false;
      resultCard.classList.add('has-result');
      resultCard.classList.remove('enter');
      void resultCard.offsetWidth;
      resultCard.classList.add('enter');
    }

    function toggleMenu(force) {
      const open = typeof force === 'boolean' ? force : !menu.classList.contains('open');
      menu.classList.toggle('open', open);
      menuButton.setAttribute('aria-expanded', String(open));
    }

    function notify(message, isError = false) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3400);
    }

    async function copyText(value) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch (_) {}
      }
      const field = document.createElement('textarea');
      field.value = value;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.left = '-9999px';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      field.setSelectionRange(0, field.value.length);
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_) {}
      field.remove();
      return copied;
    }

    copyLinkButton.addEventListener('click', async () => {
      if (!currentLink) return;
      const copied = await copyText(currentLink);
      if (!copied) {
        notify('Не удалось скопировать ссылку.', true);
        return;
      }
      clearTimeout(copyLabelTimer);
      copyLinkLabel.textContent = 'Ссылка скопирована';
      notify('Ссылка скопирована.');
      copyLabelTimer = setTimeout(() => { copyLinkLabel.textContent = 'Скопировать ссылку'; }, 1800);
    });

    function resetResult() {
      clearTimeout(reelFinishTimer);
      if (reelStartFrame !== null) cancelAnimationFrame(reelStartFrame);
      reelStartFrame = null;
      if (activeReelAnimation) activeReelAnimation.cancel();
      activeReelAnimation = null;
      if (windowsAnimationFrame !== null) cancelAnimationFrame(windowsAnimationFrame);
      windowsAnimationFrame = null;
      spinning = false;
      setControls(false);
      reelTrack.classList.remove('is-spinning');
      document.body.classList.remove('reel-is-spinning');
      lastIndex = -1;
      typeBag = [];
      currentLink = '';
      clearTimeout(copyLabelTimer);
      copyLinkLabel.textContent = 'Скопировать ссылку';
      copyLinkButton.hidden = true;
      resultKicker.textContent = 'Тема для встречи';
      resultIcon.textContent = '✦';
      emptyCopy.hidden = false;

      });
      if (!parsed.length) throw new Error('empty');
      const topicHeaders = ['название', 'тема', 'идея', 'короткое название', 'название темы', 'название идеи'];
      const textHeaders = ['текст', 'вопрос', 'описание', 'полный вопрос', 'формулировка', 'текст вопроса', 'суть темы', 'суть активности', 'суть темы или активности'];
      const typeHeaders = ['тип', 'категория', 'вид'];
      const linkHeaders = ['ссылка', 'url', 'адрес', 'link', 'ссылка на материал'];
      const tipTextHeaders = ['совет', 'текст совета', 'маленький совет', 'подсказка', 'маленькая подсказка', 'маленькая подсказка необязательно'];
      let headerIndex = -1;
      let topicColumn = '';
      let textColumn = '';
      let typeColumn = '';
      let linkColumn = '';
      let tipTextColumn = '';

      for (let index = 0; index < Math.min(parsed.length, 12); index++) {
        const entries = Object.entries(parsed[index]).map(([column, value]) => [column, normalizeHeader(value)]);
        const findColumn = aliases => (entries.find(([, value]) => aliases.includes(value)) || [])[0] || '';
        const foundTopic = findColumn(topicHeaders);
        const foundText = findColumn(textHeaders);
        const foundTipText = findColumn(tipTextHeaders);
        if (foundTopic && foundText && foundTopic !== foundText) {
          headerIndex = index;
          topicColumn = foundTopic;
          textColumn = foundText;
          typeColumn = findColumn(typeHeaders);
          linkColumn = findColumn(linkHeaders);
          tipTextColumn = foundTipText;
          break;
        }
      }
      if (headerIndex < 0) throw new Error('headers');

      const dataRows = parsed.slice(headerIndex + 1);
      const importedTopics = dataRows
        .filter(row => String(row[topicColumn] || '').trim() || String(row[textColumn] || '').trim())
        .map(row => ({
          type: typeColumn ? normalizeIdeaType(row[typeColumn]) : 'Тема',
          topic: String(row[topicColumn] || ''),
          question: String(row[textColumn] || ''),
          link: linkColumn ? String(row[linkColumn] || '') : '',
          tip: tipTextColumn ? String(row[tipTextColumn] || '') : ''
        }));
      return { topics: importedTopics };
    }

    renderRestingReel(0);
  </script>
</body>
</html>
